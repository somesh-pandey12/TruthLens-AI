# Render Blueprint: dono backend services ek saath deploy hoti hain.
# Secrets (sync: false) Render dashboard mein manually daalne hain.
services:
  - type: web
    name: truthlens-ml
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ML_API_KEY
        sync: false
      - key: GROQ_MODELS
        value: openai/gpt-oss-120b,openai/gpt-oss-20b
      - key: FACTCHECK_MODELS
        value: groq/compound-mini,openai/gpt-oss-120b
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: truthlens-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_API_KEY
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false